<style>body {
    background-color: #050505;
    color: #e5e2e1
    }
.glass-panel {
    background: rgba(18, 18, 18, 0.7);

    -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(46, 46, 46, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1)
    }
.luxury-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(154, 143, 128, 0.5);
    border-radius: 0;
    color: #e5e2e1;
    transition: all 0.3s ease
    }

    }

<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed w-full z-50 bg-black/70 backdrop-blur-xl docked full-width top-0 border-b border-white/10 flex justify-between items-center px-8 py-6 max-w-[1440px] mx-auto border-b border-[#2E2E2E]/50 flat with 20px backdrop-blur">
<div class="text-xl font-light tracking-[0.3em] text-white uppercase">AESTHET</div>
<div class="hidden md:flex space-x-8 items-center font-manrope tracking-[0.2em] text-[10px] uppercase font-medium">
<a class="text-white/60 hover:text-white transition-opacity duration-300" href="#">Collection</a>
<a class="text-white font-semibold" href="#">Atelier</a>
<a class="text-white/60 hover:text-white transition-opacity duration-300" href="#">Archive</a>
<a class="text-white/60 hover:text-white transition-opacity duration-300" href="#">Journal</a>
</div>
<div>
<a class="font-label-sm text-label-sm text-[#C5A059] border border-[#C5A059] px-6 py-2 hover:bg-[#C5A059]/10 transition-colors duration-300" href="#">Inquire</a>
</div>
</nav>
<!-- Main Content Area with Cinematic Background -->
<main class="flex-grow flex items-center justify-center relative bg-cinematic" data-alt="Dark, moody atmospheric background with subtle swirling smoke textures and deep black tones, cinematic lighting">
<div class="absolute inset-0 overlay-dark"></div>
<!-- Centered Floating Panel -->
<div class="relative z-10 w-full max-w-2xl mx-gutter my-section-gap glass-panel p-12 md:p-16 rounded-DEFAULT flex flex-col items-center">
<div class="text-center mb-12">
<span class="font-label-sm text-label-sm text-primary-container mb-4 block">KAIROS</span>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2 tracking-[0.15em] font-light">Create Your Experience</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Define the parameters of your exclusive event.</p>
</div>
<form class="w-full space-y-8">
<!-- Input Group -->
<div class="relative group">
<input class="luxury-input w-full py-3 px-0 font-body-md text-body-md" id="eventName" placeholder="Event Nomenclature" required="" type="text"/>
<label class="sr-only" for="eventName">Event Nomenclature</label>
</div>
<!-- Input Group Two Columns -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="relative group">
<input class="luxury-input w-full py-3 px-0 font-body-md text-body-md" id="eventDate" required="" type="date"/>
<label class="sr-only" for="eventDate">Date of Inception</label>
</div>
<div class="relative group">
<input class="luxury-input w-full py-3 px-0 font-body-md text-body-md" id="eventTime" required="" type="time"/>
<label class="sr-only" for="eventTime">Hour of Commencement</label>
</div>
</div>
<!-- Input Group -->
<div class="relative group">
<input class="luxury-input w-full py-3 px-0 font-body-md text-body-md" id="eventLocation" placeholder="Coordinates / Locale" required="" type="text"/>
<label class="sr-only" for="eventLocation">Coordinates / Locale</label>
</div>
<!-- Input Group -->
<div class="relative group">
<input class="luxury-input w-full py-3 px-0 font-body-md text-body-md" id="guestCount" max="50" min="1" placeholder="Select Guest Configuration (Max 50)" type="number"/>
<label class="sr-only" for="guestCount">Guest Configuration</label>
</div>
<!-- Textarea Group -->
<div class="relative group mt-12">
<textarea class="luxury-input w-full py-3 px-0 font-body-md text-body-md resize-none" id="eventDetails" placeholder="Specific Requirements &amp; Ambience Preferences" rows="3"></textarea>
<label class="sr-only" for="eventDetails">Specific Requirements</label>
</div>
<!-- CTA Button -->
<div class="mt-16 flex justify-center w-full pt-8">
<button class="w-full md:w-auto px-12 py-4 border border-primary text-primary font-label-sm text-label-sm hover:bg-primary/10 transition-all duration-300 tracking-[0.2em] uppercase flex items-center justify-center gap-3" type="submit">
<span>Initialize Event</span>
<span class="material-symbols-outlined text-[16px]">arrow_right_alt</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-[#050505] full-width py-16 border-t border-[#2E2E2E]/30 tonal shift with subtle top border no shadows, flat canvas flex flex-col md:flex-row justify-between items-center px-12 max-w-[1440px] mx-auto z-20 relative">
<div class="text-lg font-light tracking-widest text-white uppercase mb-8 md:mb-0">AESTHET</div>
<div class="font-manrope text-[9px] tracking-widest uppercase text-white/40 mb-8 md:mb-0">
            © 2024 AESTHET. ALL RIGHTS RESERVED.
        </div>
<div class="flex space-x-8 font-manrope text-[9px] tracking-widest uppercase">
<a class="text-white/40 hover:text-[#C5A059] transition-colors duration-300" href="#">Privacy</a>
<a class="text-white/40 hover:text-[#C5A059] transition-colors duration-300" href="#">Terms</a>
<a class="text-white/40 hover:text-[#C5A059] transition-colors duration-300" href="#">Legal</a>
</div>
</footer>
</body></html>
