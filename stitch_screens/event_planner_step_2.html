<style>
        .glass-panel {
            background: rgba(28, 27, 27, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(154, 143, 128, 0.3);

<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col pt-xl">
<!-- TopNavBar (Shared Component) - Rendered but inactive logic since it's a flow -->
<header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-md border-b border-outline/30">
<div class="flex justify-between items-center px-xl py-md w-full max-w-container-max mx-auto">
<div class="font-h1 text-h1 font-light tracking-[0.2em] text-on-surface">KAIROS</div>
<button class="text-primary font-eyebrow text-eyebrow uppercase tracking-[0.1em] hover:text-primary-fixed transition-colors duration-300">
                Cancel Planning
            </button>
</div>
</header>
<!-- Main Content Canvas (Max 900px centered for this flow) -->
<main class="flex-grow w-full max-w-[900px] mx-auto px-md py-xl flex flex-col gap-xl">
<!-- Stepper Header -->
<div class="flex flex-col gap-sm items-center text-center">
<p class="font-eyebrow text-eyebrow text-primary uppercase">Step 02</p>
<h1 class="font-h1 text-h1 text-on-surface">Location &amp; Vibe</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-md">Select your preferred city and define the aesthetic direction for your event.</p>
</div>
<!-- Form Area -->
<div class="flex flex-col gap-xl">
<!-- City Selection Grid -->
<section class="flex flex-col gap-md">
<h2 class="font-eyebrow text-eyebrow text-on-surface uppercase border-b border-outline/30 pb-sm">Destination</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md">
<!-- City Card: Active -->
<label class="cursor-pointer group relative overflow-hidden rounded-[2px]">
<input checked="" class="peer sr-only" name="city" type="radio" value="karachi"/>
<div class="h-32 w-full relative before:absolute before:inset-0 before:bg-surface-dim/50 peer-checked:before:bg-transparent transition-all border border-outline/30 peer-checked:border-primary">

<div class="absolute bottom-sm left-sm right-sm z-10 flex justify-between items-end">
<span class="font-h2 text-h2 text-on-surface drop-shadow-md">Karachi</span>
<span class="material-symbols-outlined text-primary opacity-100 font-[200] transition-opacity" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- City Card: Inactive -->
<label class="cursor-pointer group relative overflow-hidden rounded-[2px]">
<input class="peer sr-only" name="city" type="radio" value="lahore"/>
<div class="h-32 w-full relative before:absolute before:inset-0 before:bg-surface-dim/70 peer-checked:before:bg-transparent transition-all border border-outline/30 peer-checked:border-primary group-hover:before:bg-surface-dim/40">
<img alt="Lahore" class="w-full h-full object-cover grayscale opacity-70 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" data-alt="A minimalist, editorial-style photograph of Badshahi Mosque in Lahore. The composition relies on vast negative space and razor-sharp geometric precision. The color scheme is desaturated, focusing on the textures of heritage architecture with deep charcoal shadows and subtle gold highlights, evoking a sense of calm and heritage luxury." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0BBOOxejeGdID6P9_DQDFkVcUx3jLjcYVLJVIxWXALhL4uMAVnvFEIyquTeS2criIn2ycK-y192-TPknU_01ZO5F7Blumh6vXczIDBKgxl1dRN-hfdGymmjstmXv43pjtUIcJPcNkRTno7b0IWc5fa_akPackmfOoCN3WXeONRSrvyktmTlUzO1KWEy8FFR9ErY6e5nlD56LRwSfEDPUdEnt5_4NGM5N3v775WfreOyHURlbALO2aDPyfaGiXwdaasDWzvl9z4zk"/>
<div class="absolute bottom-sm left-sm right-sm z-10">
<span class="font-h2 text-h2 text-on-surface drop-shadow-md">Lahore</span>
</div>
</div>
</label>
<!-- City Card: Inactive -->
<label class="cursor-pointer group relative overflow-hidden rounded-[2px]">
<input class="peer sr-only" name="city" type="radio" value="islamabad"/>
<div class="h-32 w-full relative before:absolute before:inset-0 before:bg-surface-dim/70 peer-checked:before:bg-transparent transition-all border border-outline/30 peer-checked:border-primary group-hover:before:bg-surface-dim/40">
<img alt="Islamabad" class="w-full h-full object-cover grayscale opacity-70 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" data-alt="A serene, glassmorphism-inspired view of Faisal Mosque in Islamabad at dusk. The sky is a deep, velvety black-blue, contrasting with the stark white geometry of the structure. The lighting is cinematic, highlighting the modern lines of the architecture. The overall mood is understated elegance and quiet luxury." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCj3EOzikIO1cN1H2kHmYDzkBRTeqXxP03AQIQd6EMWsZp1zA696dI_xq6EYpPMp8sYVMYiT8VHnzFfd-DhXGgRtu45HKc_bJEkoYSRLP5_MOF7hLmNGEaPH_H4sGq6mg8bi5StWjrzigKPxwCkmTkQ7qgDzOwcfIk-lOthlQEbBTgvMFXus4b6zCVXzOE8kUNfRRn9CvDlfGnAHSPzOn4CDlJF05ZjV_ICda6iwlhD3AmNDyMKRxm3YgeAZ3h0gy1pxn_m-mZ7OnQ"/>
<div class="absolute bottom-sm left-sm right-sm z-10">
<span class="font-h2 text-h2 text-on-surface drop-shadow-md">Islamabad</span>
</div>
</div>
</label>
<!-- City Card: Other -->
<label class="cursor-pointer group relative overflow-hidden rounded-[2px]">
<input class="peer sr-only" name="city" type="radio" value="other"/>
<div class="h-32 w-full bg-surface-container-low flex flex-col items-center justify-center border border-outline/30 peer-checked:border-primary peer-checked:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors font-[200] text-[32px]">public</span>
<span class="font-h2 text-h2 text-on-surface-variant group-hover:text-on-surface transition-colors mt-xs">Other</span>
</div>
</label>
</div>
</section>
<!-- Vibe Selection (Pills) -->
<section class="flex flex-col gap-md">
<h2 class="font-eyebrow text-eyebrow text-on-surface uppercase border-b border-outline/30 pb-sm">Event Aesthetic</h2>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="vibe" type="radio" value="elegant"/>
<div class="px-md py-sm border border-outline/30 text-on-surface-variant font-body-sm text-body-sm rounded-full peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors hover:border-primary/50">
                            Elegant
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="vibe" type="radio" value="modern"/>
<div class="px-md py-sm border border-outline/30 text-on-surface-variant font-body-sm text-body-sm rounded-full peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors hover:border-primary/50">
                            Modern Minimalist
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="vibe" type="radio" value="traditional"/>
<div class="px-md py-sm border border-outline/30 text-on-surface-variant font-body-sm text-body-sm rounded-full peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors hover:border-primary/50">
                            Heritage Traditional
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="vibe" type="radio" value="luxurious"/>
<div class="px-md py-sm border border-outline/30 text-on-surface-variant font-body-sm text-body-sm rounded-full peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors hover:border-primary/50">
                            Opulent Luxury
                        </div>
</label>
</div>
</section>
<!-- Date Picker area -->
<section class="flex flex-col gap-md">
<h2 class="font-eyebrow text-eyebrow text-on-surface uppercase border-b border-outline/30 pb-sm">Timeline</h2>
<div class="w-full md:w-1/2">
<label class="flex flex-col gap-xs">
<span class="font-eyebrow text-eyebrow text-on-surface-variant uppercase">Proposed Date</span>
<div class="relative">
<input class="w-full bg-surface-variant border border-outline/30 text-on-surface font-body text-body rounded-[2px] px-sm py-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:w-full" type="date"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none font-[200]">calendar_month</span>
</div>
</label>
</div>
</section>
</div>
<!-- Navigation Actions -->
<div class="mt-xl flex justify-between items-center border-t border-outline/30 pt-md">
<button class="text-on-surface-variant font-eyebrow text-eyebrow uppercase tracking-[0.2em] hover:text-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined font-[200] text-[18px]">arrow_back</span>
                Back
            </button>
<button class="bg-primary text-on-primary font-eyebrow text-eyebrow uppercase tracking-[0.1em] px-lg py-sm rounded-[2px] hover:bg-primary-fixed transition-colors flex items-center gap-xs">
                Next Step
                <span class="material-symbols-outlined font-[200] text-[18px]">arrow_forward</span>
</button>
</div>
</main>
</body></html>
