<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Event Planner - KAIROS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e5e2e1",
                        "primary-fixed-dim": "#e9c176",
                        "on-secondary-fixed": "#261900",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-fixed": "#d9e2ff",
                        "on-tertiary-fixed-variant": "#314672",
                        "on-primary": "#412d00",
                        "outline-variant": "#4e4639",
                        "tertiary-container": "#b1c6fa",
                        "on-tertiary": "#192f5a",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#3d527f",
                        "surface-container-highest": "#353534",
                        "on-primary-fixed-variant": "#5d4200",
                        "primary": "#ffdea5",
                        "primary-fixed": "#ffdea5",
                        "on-secondary-container": "#dab36a",
                        "surface-dim": "#131313",
                        "error": "#ffb4ab",
                        "primary-container": "#e9c176",
                        "surface": "#131313",
                        "on-secondary": "#412d00",
                        "surface-variant": "#353534",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-low": "#1c1b1b",
                        "surface-tint": "#e9c176",
                        "surface-container": "#201f1f",
                        "on-surface": "#e5e2e1",
                        "secondary-fixed": "#ffdea5",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#001a43",
                        "background": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-fixed-dim": "#b1c6fa",
                        "on-surface-variant": "#d1c5b4",
                        "on-primary-fixed": "#261900",
                        "outline": "#9a8f80",
                        "secondary": "#e9c176",
                        "secondary-container": "#604403",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed-variant": "#5d4201",
                        "inverse-primary": "#775a19",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#6a4e0c",
                        "secondary-fixed-dim": "#e9c176",
                        "surface-bright": "#393939",
                        "tertiary": "#d8e2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "lg": "48px",
                        "md": "24px",
                        "container-max": "1280px",
                        "xs": "4px",
                        "xl": "80px",
                        "sm": "12px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "h1": ["Manrope"],
                        "hero-display-mobile": ["Manrope"],
                        "eyebrow": ["Manrope"],
                        "body-sm": ["Manrope"],
                        "h2": ["Manrope"],
                        "hero-display": ["Manrope"],
                        "body": ["Manrope"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "300" }],
                        "hero-display-mobile": ["40px", { "lineHeight": "1.1", "letterSpacing": "0.1em", "fontWeight": "200" }],
                        "eyebrow": ["12px", { "lineHeight": "1.5", "letterSpacing": "0.2em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.6", "letterSpacing": "normal", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "400" }],
                        "hero-display": ["64px", { "lineHeight": "1.1", "letterSpacing": "0.15em", "fontWeight": "200" }],
                        "body": ["16px", { "lineHeight": "1.6", "letterSpacing": "normal", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar (Shared Component) - Suppressed per rules (Transactional flow) -->
<main class="flex-1 w-full max-w-[900px] mx-auto px-gutter py-xl flex flex-col">
<!-- Header -->
<header class="mb-lg">
<h1 class="font-h1 text-h1 text-on-surface mb-sm">AI Event Planner</h1>
<p class="font-body text-body text-on-surface-variant">Let KAIROS design your perfect moment. Begin by defining the scope.</p>
</header>
<!-- Stepper -->
<nav aria-label="Progress" class="mb-xl border-b border-outline/30 pb-md">
<ol class="flex justify-between items-center text-center" role="list">
<li class="relative flex-1">
<span class="font-eyebrow text-eyebrow text-primary tracking-widest block">EVENT DETAILS</span>
<div class="absolute -bottom-[25px] left-0 right-0 h-[2px] bg-primary"></div>
</li>
<li class="relative flex-1">
<span class="font-eyebrow text-eyebrow text-on-surface-variant tracking-widest block">LOCATION &amp; VIBE</span>
</li>
<li class="relative flex-1">
<span class="font-eyebrow text-eyebrow text-on-surface-variant tracking-widest block">CONFIRM</span>
</li>
<li class="relative flex-1">
<span class="font-eyebrow text-eyebrow text-on-surface-variant tracking-widest block">YOUR PLAN</span>
</li>
</ol>
</nav>
<!-- Step 1 Content -->
<div class="flex-1 flex flex-col gap-lg">
<!-- Event Type Grid -->
<section>
<h2 class="font-eyebrow text-eyebrow text-on-surface mb-md">SELECT EVENT TYPE</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md">
<!-- Selected Card -->
<button class="flex flex-col items-center justify-center p-md bg-surface-container/50 border border-primary text-primary transition-colors h-32 hover:bg-surface-container">
<span class="material-symbols-outlined text-[32px] mb-sm">favorite</span>
<span class="font-eyebrow text-eyebrow tracking-widest">WEDDING</span>
</button>
<!-- Unselected Cards -->
<button class="flex flex-col items-center justify-center p-md bg-transparent border border-outline/30 text-on-surface-variant transition-colors h-32 hover:border-primary/50 hover:text-on-surface">
<span class="material-symbols-outlined text-[32px] mb-sm">work</span>
<span class="font-eyebrow text-eyebrow tracking-widest">CORPORATE</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-transparent border border-outline/30 text-on-surface-variant transition-colors h-32 hover:border-primary/50 hover:text-on-surface">
<span class="material-symbols-outlined text-[32px] mb-sm">celebration</span>
<span class="font-eyebrow text-eyebrow tracking-widest">GALA</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-transparent border border-outline/30 text-on-surface-variant transition-colors h-32 hover:border-primary/50 hover:text-on-surface">
<span class="material-symbols-outlined text-[32px] mb-sm">restaurant</span>
<span class="font-eyebrow text-eyebrow tracking-widest">PRIVATE DINNER</span>
</button>
</div>
</section>
<!-- Inputs -->
<section class="flex flex-col gap-lg">
<div class="relative">
<label class="font-eyebrow text-eyebrow text-on-surface-variant absolute -top-md left-0" for="budget">ESTIMATED BUDGET</label>
<input class="w-full bg-transparent border-0 border-b border-outline/30 py-sm px-0 font-h2 text-h2 text-on-surface focus:ring-0 focus:border-primary placeholder:text-on-surface-variant/30 transition-colors" id="budget" name="budget" placeholder="$50,000+" type="text"/>
</div>
<div class="relative">
<label class="font-eyebrow text-eyebrow text-on-surface-variant absolute -top-md left-0" for="guests">GUEST COUNT</label>
<input class="w-full bg-transparent border-0 border-b border-outline/30 py-sm px-0 font-h2 text-h2 text-on-surface focus:ring-0 focus:border-primary placeholder:text-on-surface-variant/30 transition-colors" id="guests" name="guests" placeholder="150" type="text"/>
</div>
</section>
</div>
<!-- Footer Actions -->
<div class="mt-xl flex justify-end">
<button class="bg-primary text-on-primary font-eyebrow text-eyebrow uppercase tracking-[0.1em] px-lg py-sm rounded-DEFAULT flex items-center gap-base hover:bg-primary/90 transition-colors">
                Next Step
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</main>
</body></html>
