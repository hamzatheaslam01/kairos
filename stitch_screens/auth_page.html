                    },
                    "spacing": {

                        "lg": "48px",
                        "md": "24px",
                        "container-max": "1280px",
                        "xs": "4px",

                        "gutter": "24px"

                    "fontFamily": {

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<main class="flex-grow flex w-full h-screen">
<!-- Left Side: Visual -->
<div class="hidden lg:block lg:w-1/2 h-full relative overflow-hidden bg-surface-container-low">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-background z-10 opacity-60"></div>
<img alt="Abstract luxury visual" class="w-full h-full object-cover object-center absolute inset-0 grayscale mix-blend-overlay" data-alt="A mesmerizing, fluid abstract visual featuring slow-moving, dark gold and deep charcoal silk-like textures. The forms undulate softly, catching subtle, high-end studio lighting that accentuates the metallic sheen of the gold against an impenetrable black background. The mood is cinematic, exclusive, and quietly luxurious, perfectly embodying a premium, high-end aesthetic. The lighting creates deep, rich shadows and refined highlights, evoking the sensation of liquid gold flowing in slow motion." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDf6n32QJoQKPbOrUCw4D8FLHDGXINss-OQwPw9Vv9m2tJoXaCmF3YGN3jvclUlfCh8i2gay6bXO3GM1xiOp0f5mFlRpD2Xreu8Rz-9_RGQNi_25ALVpnPW28hRIAefrMwXnoGB4kD7f0GW0BZc3KfiLsGpMeyf1goKcWVP3B8vE40QvBbEPAs4TPaQe8OxbTlelI7qlg8qi-Y_agZadERGvgZ0Hg0TZ2BAW3pptYmmJ4P66bpfCjl0g0_ue5k7Rrd7I6bWCZNM1Kc"/>
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-background/50 to-background z-20"></div>
<!-- Subtle branding on image -->
<div class="absolute bottom-xl left-xl z-30">
<span class="font-eyebrow text-eyebrow text-on-surface-variant uppercase tracking-widest opacity-50">Est. 2024</span>
</div>
</div>
<!-- Right Side: Auth Form -->
<div class="w-full lg:w-1/2 h-full flex flex-col justify-center items-center px-md lg:px-xl relative bg-background">
<div class="w-full max-w-md mx-auto flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col gap-md text-center lg:text-left">
<h2 class="font-h1 text-h1 font-light tracking-[0.2em] text-on-surface uppercase">KAIROS</h2>
<h1 class="font-h2 text-h2 text-primary">Access the Atelier</h1>
</div>
<!-- Toggle -->
<div class="flex w-full border-b border-surface-container-highest">
<button class="flex-1 pb-sm font-eyebrow text-eyebrow uppercase text-primary border-b-2 border-primary transition-colors text-center">Login</button>
<button class="flex-1 pb-sm font-eyebrow text-eyebrow uppercase text-on-surface-variant hover:text-on-surface transition-colors text-center">Register</button>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg w-full">
<div class="flex flex-col gap-md">
<div class="relative group">
<label class="font-eyebrow text-eyebrow text-on-surface-variant absolute -top-sm left-0 transition-all" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-sm font-body text-body text-on-surface focus:ring-0 focus:border-primary transition-colors pt-md" id="email" name="email" placeholder=" " type="email"/>
</div>
<div class="relative group">
<label class="font-eyebrow text-eyebrow text-on-surface-variant absolute -top-sm left-0 transition-all" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-sm font-body text-body text-on-surface focus:ring-0 focus:border-primary transition-colors pt-md" id="password" name="password" placeholder=" " type="password"/>
<button class="absolute right-0 bottom-sm text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-between items-center w-full">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded-sm bg-transparent border-outline focus:ring-primary focus:ring-offset-background text-primary checked:bg-primary checked:border-primary transition-colors" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- CTA -->
<button class="w-full py-md px-lg border border-primary text-primary font-eyebrow text-eyebrow uppercase tracking-[0.1em] hover:bg-primary/10 transition-colors flex justify-center items-center gap-sm group" type="submit">
<span>AUTHENTICATE</span>
<span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Disclosure -->
<div class="mt-auto pt-xl text-center">
<button class="font-body-sm text-body-sm text-surface-variant hover:text-on-surface-variant transition-colors underline decoration-surface-variant hover:decoration-on-surface-variant underline-offset-4">
                        View Demo Credentials
                    </button>
</div>
</div>
</div>
</main>
</body></html>
